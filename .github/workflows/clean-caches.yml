name: Clean Caches

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  clean-caches:
    name: Clean Caches
    permissions:
      actions: write # Delete repository Actions caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches
        run: gh cache delete --all --succeed-on-no-caches --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
